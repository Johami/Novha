<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Novha · Catálogo{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts: Lora + Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Estilos propios -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <nav class="navbar navbar-expand-lg navbar-dark novha-navbar sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
  <img src="{{ url_for('static', filename='img/logo_centrado.jpg') }}" alt="Novha" height="42">
</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#inicio">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('catalogo') }}">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#visitanos">Visítanos</a></li>
          <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ============ CONTENIDO ============ -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ============ FOOTER ============ -->
  <footer id="contacto" class="novha-footer">
    <div class="container text-center">
     <img src="{{ url_for('static', filename='img/logo_centrado.jpg') }}" alt="Novha" height="56" class="mb-3">
      <div class="novha-social mb-3">
        {# TODO: reemplazar número y enlaces reales #}
        <a href="https://wa.me/573132422348" target="_blank" aria-label="WhatsApp"><i class="bi bi-whatsapp"></i></a>
        <a href="#" target="_blank" aria-label="TikTok"><i class="bi bi-tiktok"></i></a>
        <a href="#" target="_blank" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
        <a href="#" target="_blank" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      </div>

      <p class="novha-copy mb-0">© 2026 Novha. Todos los derechos reservados.</p>
    </div>
  </footer>

  <!-- ============ WHATSAPP FLOTANTE ============ -->
  {# TODO: reemplazar por número real #}
  <a href="https://wa.me/573132422348" class="novha-wa" target="_blank" aria-label="Escríbenos por WhatsApp">
    <i class="bi bi-whatsapp"></i>
  </a>

  <!-- Bootstrap JS (solo para el menú hamburguesa) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
